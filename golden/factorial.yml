in_source: |-
  (setq n 5)
  (setq acc 1)
  
  (proc fact
    (if (> n 1)
        (begin
          (setq acc (* acc n))
          (setq n (- n 1))
          (call fact))
        0))
  
  (call fact)
  
  (print-int acc)

