in_source: |-
  (proc fact (n)
    (if (= n 0)
        1
        (* n (call fact (- n 1)))
    )
  )
  
  (setq n 5)
  
  (print-pstr "fact(")
  (print-int n)
  (print-pstr ") = ")
  (print-int (call fact n))

