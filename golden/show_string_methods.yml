in_source: |-
  (setq s "Hello")
  (print s)
  (print "\n")
  
  (print-pstr "World")
  (print "\n")
  
  (print-int (pstr-len s))
  (print "\n")
  
  (print-char (pstr-get s 1))
  (print "\n")
  
  (pstr-set s 0 74)
  (print s)
  (print "\n")
  
  (print-int -123)

