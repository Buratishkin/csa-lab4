in_source: |-
  (setq best 0)
  (setq i 990)
  
  (loop (>= i 110)
    (setq j 999)
  
    (loop (>= j 100)
      (setq product (* i j))
  
      (if (> product best)
        (begin
          (setq n product)
          (setq rev 0)
  
          (loop (> n 0)
            (setq digit (% n 10))
            (setq rev (+ (* rev 10) digit))
            (setq n (/ n 10)))
  
          (if (= product rev)
            (setq best product)
            0))
        0)
  
      (setq j (- j 1)))
  
    (setq i (- i 11)))
  
  (print-int best)

