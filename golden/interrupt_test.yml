in_source: |-
  (interrupt
    (print "INT:")
    (print-char (load-at 1))
    (print-char 10))

  (enable-interrupts)
  (int)

  (setq i 0)

  (loop (< i 5)
    (print-int i)
    (print-char 10)
    (setq i (+ i 1)))
    
