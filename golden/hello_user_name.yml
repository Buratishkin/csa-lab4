in_source: |-
  (print "What is your name?\n")
  
  (print "Hello, ")
  
  (setq ch (read-char))
  
  (loop (!= ch 10)
    (print-char ch)
    (setq ch (read-char)))
  
  (print "!")

in_stdin: |
  Alice

