in_source: |-
  (setq ARR_BASE 1000)

  (setq n (read-int))
  
  (setq i 0)
  
  (loop (< i n)
    (store-at (+ ARR_BASE i) (read-int))
    (setq i (+ i 1)))
  
  (setq pass 0)
  
  (loop (< pass n)
    (setq i 0)
  
    (loop (< i (- n 1))
      (setq left_addr (+ ARR_BASE i))
      (setq right_addr (+ ARR_BASE (+ i 1)))
  
      (setq left (load-at left_addr))
      (setq right (load-at right_addr))
  
      (if (> left right)
        (begin
          (store-at left_addr right)
          (store-at right_addr left))
        0)
  
      (setq i (+ i 1)))
  
    (setq pass (+ pass 1)))
  
  (setq i 0)
  
  (loop (< i n)
    (print-int (load-at (+ ARR_BASE i)))
  
    (if (< (+ i 1) n)
      (print " ")
      0)
  
    (setq i (+ i 1)))

