in_source: |-
  (setq BASE 10000)

  ; a = 4294967296
  (setq a_hi 429496)
  (setq a_lo 7296)
  
  ; b = 4294967296
  (setq b_hi 429496)
  (setq b_lo 7296)
  
  ; sum_lo = a_lo + b_lo
  (setq sum_lo (+ a_lo b_lo))
  
  ; carry = 0 or 1
  (setq carry 0)
  
  (if (>= sum_lo BASE)
    (begin
      (setq sum_lo (- sum_lo BASE))
      (setq carry 1))
    0)
  
  ; sum_hi = a_hi + b_hi + carry
  (setq sum_hi (+ (+ a_hi b_hi) carry))
  
  (print "4294967296 + 4294967296 = ")
  
  (print-int sum_hi)
  
  ; low part must be padded to exactly 4 digits
  (if (< sum_lo 1000)
    (print "0")
    0)
  
  (if (< sum_lo 100)
    (print "0")
    0)
  
  (if (< sum_lo 10)
    (print "0")
    0)
  
  (print-int sum_lo)
  (print "\n")
  
  (print "carry = ")
  (print-int carry)

